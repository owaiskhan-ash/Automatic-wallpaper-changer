name: Build APK

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AutoWall-1.0.0.apk
          cp app/build/outputs/apk/release/app-release.apk dist/AutoWall.apk
          ls -lh dist
          sha256sum dist/*.apk > dist/sha256sums.txt
          cat dist/sha256sums.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoWall-apk
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: AutoWall 1.0.0
          make_latest: true
          body: |
            **AutoWall — automatic wallpaper changer for Android.**

            Minimal, dark, no ads, no accounts. Rotates the photos you pick on a schedule you choose.

            * Minimum Android 8.0 (API 26), built for Android 14.
            * Release-signed with the repository key (`SHA-256` fingerprint in the README).
            * Install: download `AutoWall.apk` below, then allow "install unknown apps" for your browser/file manager.

            `AutoWall.apk` always points at the newest build; `sha256sums.txt` lets you verify it.
          files: |
            dist/AutoWall-1.0.0.apk
            dist/AutoWall.apk
            dist/sha256sums.txt
