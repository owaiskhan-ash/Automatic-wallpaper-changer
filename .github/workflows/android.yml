name: Build APK

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Read version
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \(.*\)/\1/p' app/build.gradle.kts | head -1)
          echo "Found version $VERSION_NAME ($VERSION_CODE)"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        id: tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain 2>&1 | tee build.log

      - name: Build
        id: build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee -a build.log

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AutoWall-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk dist/AutoWall.apk
          ls -lh dist
          (cd dist && sha256sum *.apk > sha256sums.txt)
          cat dist/sha256sums.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoWall-${{ steps.version.outputs.name }}
          path: dist/*
          if-no-files-found: error

      # Job logs are not reachable from every environment, so surface the tail of the
      # Gradle output as a commit comment when tests or the build break.
      - name: Report failure
        if: failure() && (steps.build.outcome == 'failure' || steps.tests.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo 'Gradle failed. Last 400 lines:'
            echo '```'
            tail -n 400 build.log || true
            echo '```'
          } > failure.md
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@failure.md > /dev/null || echo "could not post comment"

      - name: Publish GitHub release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: AutoWall ${{ steps.version.outputs.name }}
          make_latest: true
          body: |
            **AutoWall — automatic wallpaper changer for Android.**

            Minimal, dark, no ads, no accounts. Rotates the photos you pick on a schedule you choose.

            * Minimum Android 8.0 (API 26), built for Android 14.
            * Photos can be picked from your gallery **or** browsed from local storage (Files & downloads).
            * Includes a one-minute rotation option and a one-tap home-screen widget for the next wallpaper.
            * Release-signed with the repository key (`SHA-256` fingerprint in the README).
            * Install: download `AutoWall.apk` below, then allow "install unknown apps" for your browser/file manager.

            `AutoWall.apk` always points at the newest build; `sha256sums.txt` lets you verify it.
          files: |
            dist/AutoWall-${{ steps.version.outputs.name }}.apk
            dist/AutoWall.apk
            dist/sha256sums.txt
